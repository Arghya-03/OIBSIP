<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TempConvert | Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            Temp<span>Convert</span>
        </div>

        <p>Quick and simple temperature conversion</p>

    </header>


    <!-- Main -->
    <main class="converter-section">

        <div class="converter-card">

            <div class="intro">

                <span class="section-label">
                    TEMPERATURE CONVERTER
                </span>

                <h1>
                    Temperature,<br>
                    made simple.
                </h1>

                <p>
                    Enter a value below and choose the units you want
                    to convert between.
                </p>

            </div>


            <!-- Temperature Input -->
            <div class="input-group">

                <label for="temperature">
                    Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="e.g. 25"
                    step="any"
                >

            </div>


            <!-- Unit Selection -->
            <div class="conversion-row">

                <div class="input-group">

                    <label for="fromUnit">
                        From
                    </label>

                    <select id="fromUnit">

                        <option value="celsius">
                            Celsius (°C)
                        </option>

                        <option value="fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <div class="conversion-arrow">
                    →
                </div>


                <div class="input-group">

                    <label for="toUnit">
                        To
                    </label>

                    <select id="toUnit">

                        <option value="fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="celsius">
                            Celsius (°C)
                        </option>

                        <option value="kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>

            </div>


            <!-- Button -->
            <button id="convertBtn">
                Convert
            </button>


            <!-- Result -->
            <div class="result-box">

                <span>
                    RESULT
                </span>

                <h2 id="result">
                    --
                </h2>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            Built with HTML, CSS & JavaScript
        </p>

        <span>
            © 2026 Arghya Maji
        </span>

    </footer>


    <script src="script.js"></script>

</body>

</html>
