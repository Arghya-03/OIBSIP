<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SimpleCalc | Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            Simp<span>Calc</span>
        </div>

        <p>Easy to calculate</p>

    </header>


    <!-- Calculator -->
    <main class="calculator-section">

        <div class="calculator">

            <!-- Display -->
            <div class="display">

                <div id="expression">
                    0
                </div>

                <div id="result">
                    0
                </div>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button class="clear" data-action="clear">
                    AC
                </button>

                <button data-action="backspace">
                    DEL
                </button>

                <button class="operator" data-operator="/">
                    ÷
                </button>

                <button class="operator" data-operator="*">
                    ×
                </button>


                <button data-number="7">
                    7
                </button>

                <button data-number="8">
                    8
                </button>

                <button data-number="9">
                    9
                </button>

                <button class="operator" data-operator="-">
                    −
                </button>


                <button data-number="4">
                    4
                </button>

                <button data-number="5">
                    5
                </button>

                <button data-number="6">
                    6
                </button>

                <button class="operator" data-operator="+">
                    +
                </button>


                <button data-number="1">
                    1
                </button>

                <button data-number="2">
                    2
                </button>

                <button data-number="3">
                    3
                </button>

                <button class="equals" data-action="equals">
                    =
                </button>


                <button class="zero" data-number="0">
                    0
                </button>

                <button data-number=".">
                    .
                </button>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            Built with HTML, CSS & JavaScript
        </p>

        <span>
            © 2026 Arghya Maji
        </span>

    </footer>


    <script src="script.js"></script>

</body>

</html>
